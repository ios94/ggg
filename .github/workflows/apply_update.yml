name: Apply Update
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Apply files from update.zip
        run: |
          test -f update.zip
          mkdir tmp_unzip
          unzip -q update.zip -d tmp_unzip
          rsync -a tmp_unzip/AshteMobile/ AshteMobile/
          rm -rf tmp_unzip update.zip
          test -f AshteMobile/Views/Common/AshteTheme.swift
          test -f AshteMobile/Views/Common/AshteInstallQueue.swift

      - name: Commit and push
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add -A
          git commit -m "New design + multi-install fix" || echo "nothing to commit"
          git push
