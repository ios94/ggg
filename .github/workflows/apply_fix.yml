name: Apply Fix From Release
on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag that contains ooooo-main_FIXED.zip"
        required: true
        default: "fix"
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download zip from the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download "${{ inputs.tag }}" --repo "${{ github.repository }}" --pattern "ooooo-main_FIXED.zip" --dir . --clobber
          test -f ooooo-main_FIXED.zip

      - name: Apply only the AshteMobile folder
        run: |
          mkdir tmp_unzip
          unzip -q ooooo-main_FIXED.zip -d tmp_unzip
          rsync -a tmp_unzip/ooooo-main/AshteMobile/ AshteMobile/
          rm -rf tmp_unzip ooooo-main_FIXED.zip
          test -f AshteMobile/Views/Common/AshteInstallQueue.swift

      - name: Commit and push
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add -A
          git commit -m "Fix: install several apps at once" || echo "nothing to commit"
          git push
