name: Apply Fix Zip
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Apply fixed files from zip
        run: |
          test -f AshteMobile_fix_files.zip
          mkdir tmp_unzip
          unzip -q AshteMobile_fix_files.zip -d tmp_unzip
          rsync -a tmp_unzip/AshteMobile/ AshteMobile/
          rm -rf tmp_unzip AshteMobile_fix_files.zip
          test -f AshteMobile/Views/Common/AshteInstallQueue.swift

      - name: Commit and push
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add -A
          git commit -m "Fix: install several apps at once" || echo "nothing to commit"
          git push
